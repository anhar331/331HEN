name: Publish exact preserved 331HEN baseline
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 331hen-release-publishing
  cancel-in-progress: false
jobs:
  reproduce-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: preserved-working-source
          path: preserved
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce preserved binary in an isolated runner directory
        run: |
          mkdir -p .cache
          cd preserved
          bash scripts/build-container.sh > ../.cache/preserved-build.log 2>&1
      - name: Require exact working checksum, inspect and publish the pending draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_preserved_baseline.py preserved
      - name: Failure diagnostics
        if: failure()
        run: tail -n 80 .cache/preserved-build.log
