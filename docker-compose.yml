services:
  hen331-build:
    build:
      context: .docker/331hen
      dockerfile: ../../Dockerfile
      secrets:
        - proxy_ca
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /workspace
    command: ["bash", "scripts/build.sh", "--release", "--jobs", "3", "--skip-dependency-sync"]
secrets:
  proxy_ca:
    file: "${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}"
